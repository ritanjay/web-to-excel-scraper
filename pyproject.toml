[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bookscraper"
version = "1.0.0"
description = "Polite web scraper that turns books.toscrape.com into a formatted Excel report"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ritanjay Rana" }]
requires-python = ">=3.9"
dependencies = [
  "requests>=2.28",
  "beautifulsoup4>=4.11",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
bookscraper = "bookscraper.cli:main"

[tool.setuptools]
packages = ["bookscraper"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP006", "UP007", "UP035", "UP045"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real website (run with -m live)"]
addopts = "-m 'not live'"
